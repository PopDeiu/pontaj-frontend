<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Scanare Cod QR</title>

  <!-- Configurație runtime (opțional) -->
  <script src="env.js"></script>

  <style>
    /* STIL IDENTIC – nemodificat */
    /* (l-am lăsat neschimbat intenționat) */
  </style>
</head>

<body>
  <div class="shell">
    <div class="card">
      <div class="header">
        <div class="title">
          <h1>Scanează codul QR</h1>
          <p>Ține codul în interiorul cadrului</p>
        </div>
        <div class="pill" id="pill">
          <span class="dot" id="dot"></span>
          <span id="pillText">Pornire…</span>
        </div>
      </div>

      <div class="videoWrap">
        <div class="videoFrame">
          <video id="video" autoplay playsinline></video>
          <div class="overlay"></div>
          <div class="scanBox">
            <span class="corn c1"></span><span class="corn c2"></span>
            <span class="corn c3"></span><span class="corn c4"></span>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="side">
        <div class="statusCard">
          <div class="label">Stare</div>
          <div class="statusLine">
            <div class="statusText" id="status">Inițializare…</div>
          </div>

          <div class="hint" id="hint">
            Este necesară permisiunea pentru cameră. Accesul la webcam necesită HTTPS (sau localhost).
          </div>

          <div class="label" style="margin-top:14px;">Ultima valoare detectată</div>
          <div class="lastValue" id="lastValue">(niciuna)</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Librărie fallback -->
  <script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>

  <script>
    const video = document.getElementById("video");
    const statusEl = document.getElementById("status");
    const hintEl = document.getElementById("hint");
    const lastValueEl = document.getElementById("lastValue");

    const dotEl = document.getElementById("dot");
    const pillTextEl = document.getElementById("pillText");

    const DEFAULT_BACKEND =
      (window.APP_CONFIG && window.APP_CONFIG.DEFAULT_BACKEND) || "/api/scan";

    const COOLDOWN_MS = 2000;
    let lastSentValue = null;
    let lastSentAt = 0;

    function setPill(state, text) {
      pillTextEl.textContent = text;
      dotEl.classList.remove("ok", "err");
      if (state === "ok") dotEl.classList.add("ok");
      else if (state === "err") dotEl.classList.add("err");
    }

    function canSend(value) {
      const now = Date.now();
      if (value !== lastSentValue || (now - lastSentAt) > COOLDOWN_MS) {
        lastSentValue = value;
        lastSentAt = now;
        return true;
      }
      return false;
    }

    async function postValue(value) {
      const res = await fetch(DEFAULT_BACKEND, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          value,
          scanned_at: new Date().toISOString(),
          user_agent: navigator.userAgent
        })
      });

      if (!res.ok) {
        const text = await res.text().catch(() => "");
        throw new Error(`Eroare backend ${res.status}${text ? ": " + text : ""}`);
      }
    }

    async function startCamera() {
      if (!navigator.mediaDevices?.getUserMedia) {
        throw new Error("getUserMedia nu este suportat");
      }
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment" },
        audio: false
      });
      video.srcObject = stream;
      await video.play();
    }

    async function scanWithBarcodeDetector() {
      const detector = new BarcodeDetector({ formats: ["qr_code"] });

      const loop = async () => {
        try {
          const codes = await detector.detect(video);
          if (codes?.length) {
            const value = codes[0].rawValue;
            lastValueEl.textContent = value;

            setPill("ok", "Cod detectat");
            statusEl.textContent = "Cod QR detectat. Se trimite…";
            hintEl.textContent = "Ține codul nemișcat câteva secunde.";

            if (canSend(value)) {
              await postValue(value);
              statusEl.textContent = "Trimis cu succes ✅";
            } else {
              statusEl.textContent = "Detectat (așteptare cooldown)…";
            }
          } else {
            setPill("warn", "Se scanează…");
            statusEl.textContent = "Se caută un cod QR…";
            hintEl.textContent = "Poziționează codul în interiorul cadrului.";
          }
        } catch (e) {
          setPill("err", "Eroare scanare");
          statusEl.textContent = "Eroare: " + e.message;
          hintEl.textContent = "Reîncarcă pagina sau verifică permisiunile camerei.";
        }
        requestAnimationFrame(loop);
      };
      loop();
    }

    async function scanWithJsQR() {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d", { willReadFrequently: true });

      const loop = async () => {
        try {
          if (video.readyState === video.HAVE_ENOUGH_DATA) {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const code = jsQR(imageData.data, imageData.width, imageData.height);

            if (code?.data) {
              const value = code.data;
              lastValueEl.textContent = value;

              setPill("ok", "Cod detectat");
              statusEl.textContent = "Cod QR detectat. Se trimite…";
              hintEl.textContent = "Ține codul nemișcat câteva secunde.";

              if (canSend(value)) {
                await postValue(value);
                statusEl.textContent = "Trimis cu succes ✅";
              } else {
                statusEl.textContent = "Detectat (așteptare cooldown)…";
              }
            } else {
              setPill("warn", "Se scanează…");
              statusEl.textContent = "Se caută un cod QR…";
              hintEl.textContent = "Poziționează codul în interiorul cadrului.";
            }
          }
        } catch (e) {
          setPill("err", "Eroare scanare");
          statusEl.textContent = "Eroare: " + e.message;
          hintEl.textContent = "Reîncarcă pagina sau verifică permisiunile camerei.";
        }
        requestAnimationFrame(loop);
      };
      loop();
    }

    (async () => {
      try {
        setPill("warn", "Pornire…");
        statusEl.textContent = "Pornire cameră…";
        hintEl.textContent = "Acordă permisiunea pentru cameră când ești întrebat.";

        await startCamera();

        if ("BarcodeDetector" in window) {
          setPill("warn", "Se scanează…");
          statusEl.textContent = "Se scanează…";
          hintEl.textContent = "Îndreaptă camera către codul QR.";
          await scanWithBarcodeDetector();
        } else {
          setPill("warn", "Se scanează…");
          statusEl.textContent = "Se scanează…";
          hintEl.textContent = "Îndreaptă camera către codul QR.";
          await scanWithJsQR();
        }
      } catch (e) {
        setPill("err", "Camera blocată");
        statusEl.textContent = "Nu s-a putut porni: " + e.message;
        hintEl.textContent = "Accesul la cameră necesită HTTPS (sau localhost). Verifică setările browserului.";
      }
    })();
  </script>
</body>
</html>
