<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Scanare Ieșire</title>

  <script src="env.js"></script>

  <style>
    :root{
      --bg1:#0b1020;
      --bg2:#0a1a2a;
      --ok:#22c55e;
      --warn:#f59e0b;
      --err:#ef4444;
      --text:#e6eaf2;
      --muted:#9aa7bd;
      --shadow:0 20px 60px rgba(0,0,0,.45);
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color:var(--text);
      background:
        radial-gradient(900px 600px at 20% 10%, rgba(99,102,241,.25), transparent 55%),
        radial-gradient(900px 600px at 80% 30%, rgba(14,165,233,.18), transparent 55%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .frame{
      width:min(1100px, 100%);
      padding:24px;
    }

    .card{
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      background:rgba(15,23,42,.55);
      border:1px solid rgba(255,255,255,.08);
      overflow:hidden;
    }

    header{
      padding:18px 22px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-size:18px;
      font-weight:700;
    }

    header span{
      font-size:14px;
      font-weight:500;
      color:var(--muted);
    }

    .videoWrap{
      position:relative;
      padding:18px;
    }

    video{
      width:100%;
      aspect-ratio:16/10;
      object-fit:cover;
      border-radius:14px;
      background:#050914;
      transform: scaleX(-1);
    }

    .scanHint{
      position:absolute;
      left:50%;top:50%;
      transform:translate(-50%,-50%);
      border:2px dashed rgba(255,255,255,.35);
      border-radius:20px;
      width:min(420px,70%);
      aspect-ratio:1;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:18px;
      font-size:18px;
      font-weight:600;
      background:rgba(0,0,0,.25);
    }

    /* SUCCESS OVERLAY */
    .success{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.75);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:999;
      opacity:0;
      pointer-events:none;
      transition:.2s;
    }

    .success.show{
      opacity:1;
      pointer-events:auto;
    }

    .successBox{
      background:linear-gradient(180deg,#22c55e,#16a34a);
      color:white;
      padding:48px 56px;
      border-radius:28px;
      text-align:center;
      box-shadow:0 30px 80px rgba(0,0,0,.6);
      animation:pop .25s ease-out;
    }

    @keyframes pop{
      from{transform:scale(.9);opacity:.6}
      to{transform:scale(1);opacity:1}
    }

    .successBox h1{
      margin:0 0 12px;
      font-size:48px;
    }

    .successBox p{
      margin:0;
      font-size:22px;
      font-weight:600;
    }

    /* ERROR OVERLAY (roșu) */
    .error{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.75);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:1000;
      opacity:0;
      pointer-events:none;
      transition:.2s;
    }
    .error.show{
      opacity:1;
      pointer-events:auto;
    }
    .errorBox{
      background:linear-gradient(180deg,#ef4444,#b91c1c);
      color:white;
      padding:44px 52px;
      border-radius:28px;
      text-align:center;
      box-shadow:0 30px 80px rgba(0,0,0,.6);
      animation:pop .25s ease-out;
      max-width: 720px;
      margin: 0 18px;
    }
    .errorBox h1{
      margin:0 0 10px;
      font-size:44px;
    }
    .errorBox p{
      margin:0;
      font-size:20px;
      font-weight:650;
      line-height:1.25;
    }
    .errorBox .small{
      margin-top:10px;
      font-size:14px;
      font-weight:600;
      opacity:.9;
    }
  </style>
</head>

<body>
  <div class="frame">
    <div class="card">
      <header>
        <div>Ieșire elevi</div>
        <span>Scanează codul QR</span>
      </header>

      <div class="videoWrap">
        <video id="video" autoplay playsinline></video>
        <div class="scanHint">
          Ține codul QR<br/>în acest pătrat
        </div>
      </div>
    </div>
  </div>

  <!-- SUCCESS OVERLAY -->
  <div class="success" id="success">
    <div class="successBox">
      <h1>✔ Scanare reușită!</h1>
      <p id="successMsg">Poți ieși. Drum bun! 👋</p>
    </div>
  </div>

  <!-- ERROR OVERLAY -->
  <div class="error" id="error">
    <div class="errorBox">
      <h1>✖ Nu a mers</h1>
      <p id="errorMsg">Te rog încearcă din nou.</p>
      <div class="small">Ține codul nemișcat în pătrat.</div>
    </div>
  </div>

  <script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>

  <script>
    const video = document.getElementById("video");
    const success = document.getElementById("success");
    const successMsg = document.getElementById("successMsg");

    const error = document.getElementById("error");
    const errorMsg = document.getElementById("errorMsg");

    const BACKEND =
      (window.APP_CONFIG && window.APP_CONFIG.DEFAULT_BACKEND);

    const RESET_MS = 3000;
    const ERROR_MS = 2500;
    let lastValue = null;

    function showSuccess(name){
      successMsg.textContent = name
        ? `Scanare reușită, ${name}! Poți ieși 👋`
        : "Scanare reușită! Poți ieși 👋";

      success.classList.add("show");
      setTimeout(() => {
        success.classList.remove("show");
        lastValue = null;
      }, RESET_MS);
    }

    function showError(message){
      errorMsg.textContent = message || "Te rog încearcă din nou.";
      error.classList.add("show");
      setTimeout(() => {
        error.classList.remove("show");
        lastValue = null;
      }, ERROR_MS);
    }

    // Trimite valoarea QR ca HTTP Bearer (Authorization header)
    // Consideră scanarea validă doar dacă răspunsul e JSON și are Activ: 1
    // Trimite valoarea QR ca HTTP Bearer
    async function postValue(value){
      if (!BACKEND) {
        throw new Error("BACKEND nu este setat (DEFAULT_BACKEND lipsește).");
      }

      const res = await fetch(BACKEND,{
        method:"POST",
        headers:{
          "Authorization": `Bearer ${value}`,
          "Content-Type":"application/json"
        },
        body: JSON.stringify({
          scanned_at: new Date().toISOString()
        })
      });

      // 1. Încercăm să parsam JSON-ul indiferent de status (poate conține eroarea)
      let data;
      try {
        data = await res.json();
      } catch (e) {
        // Dacă nu e JSON și avem eroare HTTP, aruncăm eroarea de status
        if (!res.ok) throw new Error(`Eroare server (${res.status}).`);
      }

      // 2. Dacă serverul a răspuns cu eroare (ex: 400, 403, 409)
      if (!res.ok) {
        // Verificăm dacă serverul a trimis un mesaj specific în "detail"
        if (data && data.detail) {
          throw new Error(data.detail); 
        }
        // Fallback dacă nu există "detail"
        throw new Error(`Eroare neașteptată (${res.status}).`);
      }

      // 3. Dacă statusul e 200 OK, verificăm logica de business (Activ)
      const activ = data?.Activ;
      const ok =
        activ === 1 ||
        activ === "1" ||
        activ === true;

      if (!ok) {
        // Poți personaliza și aici dacă serverul trimite motivul inactivității
        throw new Error("Scanarea nu este acceptată (Elev Inactiv).");
      }

      return data;
    }

    async function startCamera(){
      const stream = await navigator.mediaDevices.getUserMedia({
        video:{ facingMode:"environment" },
        audio:false
      });
      video.srcObject = stream;
      await video.play();
    }

    async function scan(){
      const detector = "BarcodeDetector" in window
        ? new BarcodeDetector({ formats:["qr_code"] })
        : null;

      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d", { willReadFrequently:true });

      async function loop(){
        try{
          let value = null;

          if(detector){
            const codes = await detector.detect(video);
            if(codes.length) value = codes[0].rawValue;
          } else {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video,0,0);
            const img = ctx.getImageData(0,0,canvas.width,canvas.height);
            const code = jsQR(img.data,img.width,img.height);
            if(code) value = code.data;
          }

          if(value && value !== lastValue){
            lastValue = value;

            try {
              const data = await postValue(value);
              showSuccess(data?.Name);
            } catch (e) {
              showError(e?.message || "Nu a mers. Încearcă din nou.");
            }
          }
        }catch{}
        requestAnimationFrame(loop);
      }
      loop();
    }

    (async ()=>{
      await startCamera();
      await scan();
    })();
  </script>
</body>
</html>
